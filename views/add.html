<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anime Reviews">
  <meta name="theme-color" content="#121216" id="themeColorMeta">
  <title>Sexy Anime Reviews</title>
  <link href='https://fonts.googleapis.com/css?family=PT+Sans+Narrow|Open+Sans' rel='stylesheet' type='text/css'>
  <link rel="apple-touch-icon" sizes="180x180" href="/pub/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/pub/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/pub/favicon-16x16.png">
  <link rel="stylesheet" href="/pub/themes/theme-dark.css?v=${app_version}">
  <link rel="stylesheet" href="/pub/themes/theme-light.css?v=${app_version}">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('sar-theme');
        var theme = storedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.getElementById('themeColorMeta');
        if (meta) {
          meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#121216');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style type="text/css">
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      padding: 0 6%;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      font-family: 'Open Sans', Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--primary-text-color);
      background-color: var(--primary-background-color);
      background-image: var(--body-bg-image);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
      box-sizing: border-box;
    }

    .theme-switch-wrapper {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top, 0px));
      right: calc(6% + env(safe-area-inset-right, 0px));
      z-index: 1200;
      display: flex;
      align-items: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 0 12px;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      }

      .theme-switch-wrapper {
        top: calc(12px + env(safe-area-inset-top, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
      }
    }
  </style>
</head>

<body>
  <div class="theme-switch-wrapper">
    <sar-theme-switch id="themeSwitch"></sar-theme-switch>
  </div>
  <script type="module" src="/components/sar/sar-theme-switch.js?v=${app_version}"></script>
  <script type="module" src="/pub/dist/add.bundle.js?v=${app_version}"></script>
  <sar-author-form></sar-author-form>
</body>

</html>
