<!DOCTYPE html>
<html>

<head>
  <title>Spoiler Free Anime Reviews</title>
  <link href='https://fonts.googleapis.com/css?family=PT+Sans+Narrow|Open+Sans' rel='stylesheet' type='text/css'>
  <link rel="apple-touch-icon" sizes="180x180" href="/pub/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/pub/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/pub/favicon-16x16.png">
  <link rel="manifest" href="/pub/site.webmanifest">
  <style type="text/css">
    :root {
      /* theme-carbon-fiber styles */
      --dark-primary-color: #7B1FA2;
      --default-primary-color: #9C27B0;
      --light-primary-color: #E1BEE7;
      --text-primary-color: #FFFFFF;
      --accent-color: #03A9F4;
      --primary-background-color: #ffffff;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --disabled-text-color: #bdbdbd;
      --divider-color: #B6B6B6;
      --sar-card-text-color: var(--primary-text-color);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      -webkit-user-select: none;
      user-select: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1IiBoZWlnaHQ9IjUiPgo8cmVjdCB3aWR0aD0iNSIgaGVpZ2h0PSI1IiBmaWxsPSIjZmZmIj48L3JlY3Q+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNjY2MiPjwvcmVjdD4KPC9zdmc+");
    }

    neon-animated-pages {
      height: 100%;
    }
  </style>
</head>

<body>
  <script type="module" src="/pub/dist/main.bundle.js"></script>
  <script src="/components/webcomponentsjs/webcomponents-lite.min.js"></script>
  <link href="/components/polymer/polymer.html" rel="import">
  <link href="/components/neon-animation/neon-animated-pages.html" rel="import">
  <link href="/components/neon-animation/neon-animations.html" rel="import">
  <link href="/components/iron-flex-layout/iron-flex-layout.html" rel="import">
  <link href="/components/sar/theme-carbon-fiber.html" rel="import">
  <link href="/components/sar/util.html" rel="import">
  <neon-animated-pages selected="0" id="pages">
    <sar-card-container id="cards"></sar-card-container>
    <sar-review id="review"></sar-review>
  </neon-animated-pages>
  <script>
    var pages = document.querySelector('#pages');
    var cards = document.querySelector('#cards');
    var review = document.querySelector('#review');
    var isAdmin = ${ is_admin };

    var syncAdmin = function () {
      if (review) {
        review.isAdmin = isAdmin;
      }
    };
    syncAdmin();
    if (window.customElements) {
      customElements.whenDefined('sar-review').then(syncAdmin);
    }

    cards.addEventListener('card-selected', function (event) {
      window.history.pushState(null, null, '/a/' + cleanTitle(event.detail.review.title));
      review.review = event.detail.review;
      review.isAdmin = isAdmin;
      pages.selected = 1;
    });

    review.addEventListener('exit-click', function (event) {
      window.history.pushState(null, null, '/');
      pages.selected = 0;
    });

    window.onpopstate = function (event) {
      pages.selected = 0;
      if (cards && typeof cards.selectCard === 'function') {
        cards.selectCard();
      }
    };
  </script>
</body>

</html>
